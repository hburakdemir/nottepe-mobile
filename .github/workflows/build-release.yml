name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Elle tetikleme: olcum turlarinda her APK icin surum etiketi atmak ya da
  # main'e merge etmek gerekmiyor. Dispatch'te "Create Release" adimi zaten
  # atlanir (yalnizca refs/tags/* icin kosullu), APK artifact olarak gelir.
  workflow_dispatch:

env:
  # .env.production gitignore'da oldugu icin CI'da mevcut degil.
  # Bu deger olmadan src/lib/config.ts localhost'a dusuyor ve APK hicbir API'ye ulasamiyor.
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://nottepe.com/api' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚠️ BU ADIM BILEREK BUILD'DEN ONCE. Onceki hali build'den SONRAYDI ve
      # patliyordu; run #18 ve #19'da derleme BASARILIYDI (BUILD SUCCESSFUL,
      # APK paketlenmis) ama job bu adimda olup artifact hic yuklenmedi.
      # 23 dakikalik iki derleme bu yuzden cope gitti.
      #
      # Eski komut: grep '"version"' app.json | head -1 | grep -oP '"\K[^"]*'
      # `"\K[^"]*` her tirnaktan SONRASINI ayri ayri yakaliyor, yani
      # `    "version": "1.0.8",` satiri icin tek deger degil DORT satir basiyor:
      #   version / : / 1.0.8 / ,
      # $GITHUB_OUTPUT cok satirli ham degeri kabul etmiyor:
      #   "Unable to process file command 'output' successfully. Invalid format ': '"
      #
      # Artik JSON dogrudan okunuyor — tirnak ayiklama isi yok, cikti tek satir.
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p 'require("./app.json").expo.version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: '27.1.12297006'

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --clean --platform android

      # Release: JS bundle APK'ya gomulur (debug APK Metro sunucusu ister, baska cihazda acilmaz).
      # Tek mimari: 4 mimarinin CMake derlemesi runner diskini dolduruyordu.
      - name: Build APK
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nottepe-mobile-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
