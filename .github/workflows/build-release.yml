name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  # .env.production gitignore'da oldugu icin CI'da mevcut degil.
  # Bu deger olmadan src/lib/config.ts localhost'a dusuyor ve APK hicbir API'ye ulasamiyor.
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://nottepe.com/api' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: '27.1.12297006'

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --clean --platform android

      # Release: JS bundle APK'ya gomulur (debug APK Metro sunucusu ister, baska cihazda acilmaz).
      # Tek mimari: 4 mimarinin CMake derlemesi runner diskini dolduruyordu.
      - name: Build APK
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Get version
        id: version
        run: echo "version=$(grep '"version"' app.json | head -1 | grep -oP '"\K[^"]*')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nottepe-mobile-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
