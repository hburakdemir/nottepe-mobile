<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Nottepe Instagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter Display', 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  /* ——— Temalar ——— */
  .canvas[data-theme="yesil"] {
    --bg: radial-gradient(110% 70% at 50% 12%, #427570 0%, #2F5755 42%, #1B3432 100%);
    --ink: #fff; --sub: rgba(255,255,255,.86); --hl: #A8E6DA;
    --kicker-bg: rgba(255,255,255,.12); --kicker-line: rgba(255,255,255,.28); --kicker-ink: #fff; --dot: #4ade80;
    --glow: rgba(150,215,203,.28); --icon-ring: rgba(255,255,255,.9);
    --dev-shadow: 0 50px 90px rgba(0,0,0,.45), 0 12px 28px rgba(0,0,0,.3);
  }
  .canvas[data-theme="acik"] {
    --bg: linear-gradient(180deg, #FFFFFF 0%, #F2F6F5 50%, #E1EBE9 100%);
    --ink: #111827; --sub: #4B5563; --hl: #2F5755;
    --kicker-bg: rgba(47,87,85,.08); --kicker-line: rgba(47,87,85,.25); --kicker-ink: #2F5755; --dot: #16A34A;
    --glow: rgba(47,87,85,.16); --icon-ring: rgba(255,255,255,0);
    --dev-shadow: 0 45px 80px rgba(27,52,50,.28), 0 10px 24px rgba(27,52,50,.18);
  }

  .canvas {
    position: relative; overflow: hidden;
    width: var(--w); height: var(--h);
    background: var(--bg); color: var(--ink);
  }
  .glow {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: var(--glow-t); width: 1300px; height: 1000px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--glow), transparent);
  }

  /* ——— Metin bloğu ——— */
  .head {
    position: absolute; left: 0; right: 0; top: var(--head-t);
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 0 70px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img {
    width: var(--icon); height: var(--icon); border-radius: 23%;
    box-shadow: 0 0 0 3px var(--icon-ring), 0 10px 26px rgba(0,0,0,.25);
  }
  .brand span { font-size: var(--brand-fs); font-weight: 800; letter-spacing: -.02em; }

  .kicker {
    margin-top: var(--kicker-mt);
    display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 22px; border-radius: 999px;
    background: var(--kicker-bg); border: 1.5px solid var(--kicker-line); color: var(--kicker-ink);
    font-size: var(--kicker-fs); font-weight: 700; letter-spacing: .12em;
  }
  .kicker i {
    width: 11px; height: 11px; border-radius: 50%; background: var(--dot);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--dot) 25%, transparent);
  }
  h1 {
    margin-top: var(--h1-mt);
    font-size: var(--h1-fs); font-weight: 900; line-height: 1.0; letter-spacing: -.035em;
  }
  h1 em { font-style: normal; color: var(--hl); }
  .sub {
    margin-top: var(--sub-mt); max-width: var(--sub-w);
    font-size: var(--sub-fs); font-weight: 500; line-height: 1.3;
    color: var(--sub); text-wrap: balance;
  }

  .badges { margin-top: var(--badges-mt); display: flex; gap: 18px; }
  .badge {
    display: flex; align-items: center; gap: calc(var(--badge-h) * .16);
    height: var(--badge-h); padding: 0 calc(var(--badge-h) * .34) 0 calc(var(--badge-h) * .26);
    background: #000; color: #fff; border: 2px solid #a6a6a6; border-radius: calc(var(--badge-h) * .2);
    box-shadow: 0 12px 26px rgba(0,0,0,.25);
    text-align: left;
  }
  .badge svg { width: calc(var(--badge-h) * .5); height: calc(var(--badge-h) * .5); flex: none; }
  .badge small { display: block; font-size: calc(var(--badge-h) * .19); font-weight: 500; line-height: 1.1; opacity: .92; }
  .badge b { display: block; font-size: calc(var(--badge-h) * .34); font-weight: 700; line-height: 1.05; letter-spacing: -.01em; }
  .url { margin-top: var(--url-mt); font-size: var(--url-fs); font-weight: 600; letter-spacing: .04em; color: var(--sub); }

  /* ——— Cihazlar ———
     Ölçüler cihaz genişliğine (--dw) oranla verildi; böylece her boyutta aynı oranlar. */
  .dev { position: absolute; width: var(--dw); }
  .screen { position: relative; overflow: hidden; background: #fff; }
  .screen > img { display: block; width: 100%; }
  .screen > svg.sb { position: absolute; left: 0; top: 0; width: 100%; height: auto; display: block; }

  /* iPhone — titanyum kasa + ince siyah çerçeve + Dynamic Island */
  .iphone {
    padding: calc(var(--dw) * .034);
    border-radius: calc(var(--dw) * .17);
    background: #050505;
    box-shadow:
      0 0 0 calc(var(--dw) * .012) #4a4b50,
      0 0 0 calc(var(--dw) * .016) #2a2b2f,
      var(--dev-shadow);
  }
  .iphone .screen { border-radius: calc(var(--dw) * .137); }
  .iphone .island {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--dw) * .058); width: calc(var(--dw) * .30); height: calc(var(--dw) * .088);
    border-radius: 999px; background: #000;
  }
  .iphone .btn { position: absolute; width: calc(var(--dw) * .014); background: #3a3b40; border-radius: 3px; }
  .iphone .btn.l { left: calc(var(--dw) * -.029); }
  .iphone .btn.r { right: calc(var(--dw) * -.029); }

  /* iPad — alüminyum kenar + eşit siyah çerçeve, yatay */
  .ipad {
    padding: calc(var(--dw) * .026);
    border-radius: calc(var(--dw) * .042);
    background: #050505;
    box-shadow:
      0 0 0 calc(var(--dw) * .005) #b9bcc2,
      0 0 0 calc(var(--dw) * .007) #8a8d93,
      var(--dev-shadow);
  }
  .ipad .screen { border-radius: calc(var(--dw) * .017); }
  .ipad .cam {
    position: absolute; left: 50%; top: calc(var(--dw) * .011); transform: translateX(-50%);
    width: calc(var(--dw) * .007); height: calc(var(--dw) * .007); border-radius: 50%;
    background: #1c2230; box-shadow: 0 0 0 1px #111;
  }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="glow"></div>

  <!-- iPad: Yemek Listesi (arkada, ortada) -->
  <div class="dev ipad" id="ipad">
    <div class="screen">
      <img src="ipad_yemek.jpg" alt="">
      <!-- Durum çubuğu: ekran görüntüsünün kendi piksel koordinatlarında (1600 genişlik) -->
      <svg class="sb" viewBox="0 0 1600 36" aria-hidden="true">
        <rect width="1600" height="36" fill="#fefefe"/>
        <text x="22" y="23" font-family="Inter Display" font-size="17" fill="#000"><tspan font-weight="600">9:41</tspan><tspan dx="12" font-weight="500">13 Eyl Paz</tspan></text>
        <g fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round">
          <path d="M1482.6 15.1 A12 12 0 0 1 1499.4 15.1"/>
          <path d="M1486.1 18.6 A7 7 0 0 1 1495.9 18.6"/>
        </g>
        <circle cx="1491" cy="22.2" r="2.2" fill="#000"/>
        <text x="1544" y="23" text-anchor="end" font-family="Inter Display" font-size="15" font-weight="600" fill="#000">%100</text>
        <rect x="1550" y="10" width="30" height="14" rx="4" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="1.6"/>
        <rect x="1552.5" y="12.5" width="25" height="9" rx="2.2" fill="#000"/>
        <rect x="1581.5" y="14.5" width="2" height="5" rx="1" fill="#000" fill-opacity=".4"/>
      </svg>
    </div>
    <i class="cam"></i>
  </div>

  <!-- iPhone sol: Ana Sayfa -->
  <div class="dev iphone" id="phL">
    <i class="btn l" style="top:17%;height:5%"></i>
    <i class="btn l" style="top:25%;height:9%"></i>
    <i class="btn l" style="top:36%;height:9%"></i>
    <i class="btn r" style="top:28%;height:13%"></i>
    <div class="screen">
      <img src="iphone_ana_sayfa.png" alt="">
      <svg class="sb" viewBox="0 0 1170 139"><use href="#sb-iphone"/></svg>
    </div>
    <div class="island"></div>
  </div>

  <!-- iPhone sağ: Araçlar -->
  <div class="dev iphone" id="phR">
    <i class="btn l" style="top:17%;height:5%"></i>
    <i class="btn l" style="top:25%;height:9%"></i>
    <i class="btn l" style="top:36%;height:9%"></i>
    <i class="btn r" style="top:28%;height:13%"></i>
    <div class="screen">
      <img src="iphone_araclar.png" alt="">
      <svg class="sb" viewBox="0 0 1170 139"><use href="#sb-iphone"/></svg>
    </div>
    <div class="island"></div>
  </div>

  <div class="head">
    <div class="brand">
      <img src="../../../assets/icon.png" alt="">
      <span>Nottepe</span>
    </div>
    <div class="kicker"><i></i>MOBİL UYGULAMA YAYINDA</div>
    <h1>Nottepe artık<br><em>cebinde!</em></h1>
    <p class="sub">Ders notları, ring saatleri ve yemek listesi tek uygulamada.</p>
    <div class="badges">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        <div><small>Hemen indir</small><b>App Store</b></div>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924z"/>
          <path fill="#34A853" d="M13.544 10.989l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973z"/>
          <path fill="#EA4335" d="M13.544 13.056l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/>
          <path fill="#FBBC04" d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594z"/>
        </svg>
        <div><small>Hemen indir</small><b>Google Play</b></div>
      </div>
    </div>
    <div class="url" id="url">nottepe.com</div>
  </div>
</div>

<!-- iPhone durum çubuğu (1170 genişlikli ekran görüntüsü koordinatları; orijinal 0–140 px beyaz) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="sb-iphone" viewBox="0 0 1170 139">
  <rect width="1170" height="139" fill="#fff"/>
  <text x="190" y="99" text-anchor="middle" font-family="Inter Display" font-size="52" font-weight="600" fill="#000">9:41</text>
  <g fill="#000">
    <rect x="852" y="80" width="13" height="14" rx="3"/>
    <rect x="870" y="73" width="13" height="21" rx="3"/>
    <rect x="888" y="66" width="13" height="28" rx="3"/>
    <rect x="906" y="59" width="13" height="35" rx="3"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="7.5" stroke-linecap="round">
    <path d="M940.4 69.7 A30 30 0 0 1 982.6 69.7"/>
    <path d="M949.6 78.9 A17 17 0 0 1 973.4 78.9"/>
  </g>
  <circle cx="961.5" cy="89" r="5.8" fill="#000"/>
  <rect x="1002" y="61" width="70" height="34" rx="10" fill="none" stroke="#000" stroke-opacity=".38" stroke-width="3"/>
  <rect x="1007" y="66" width="60" height="24" rx="6" fill="#000"/>
  <rect x="1075" y="71" width="5" height="14" rx="2.5" fill="#000" fill-opacity=".4"/>
</symbol></svg>

<script>
  // ?f=post (1080×1350, 4:5) | story (1080×1920, 9:16);  ?t=yesil | acik
  const FORMATS = {
    post: {
      vars: {
        '--w': '1080px', '--h': '1350px',
        '--head-t': '56px', '--icon': '76px', '--brand-fs': '42px',
        '--kicker-mt': '26px', '--kicker-fs': '19px',
        '--h1-mt': '20px', '--h1-fs': '88px',
        '--sub-mt': '18px', '--sub-fs': '28px', '--sub-w': '720px',
        '--badges-mt': '28px', '--badge-h': '76px',
        '--url-mt': '0px', '--url-fs': '0px',
        '--glow-t': '520px',
      },
      showUrl: false,
      // [genişlik, sol, üst]
      ipad: [780, 150, 615],
      phL: [270, 40, 752],
      phR: [270, 770, 752],
    },
    story: {
      vars: {
        '--w': '1080px', '--h': '1920px',
        '--head-t': '250px', '--icon': '92px', '--brand-fs': '50px',
        '--kicker-mt': '36px', '--kicker-fs': '23px',
        '--h1-mt': '26px', '--h1-fs': '106px',
        '--sub-mt': '24px', '--sub-fs': '34px', '--sub-w': '820px',
        '--badges-mt': '40px', '--badge-h': '92px',
        '--url-mt': '28px', '--url-fs': '27px',
        '--glow-t': '900px',
      },
      showUrl: true,
      ipad: [820, 130, 1040],
      phL: [280, 14, 1235],
      phR: [280, 786, 1235],
    },
  };
  const q = new URLSearchParams(location.search);
  const f = FORMATS[q.get('f') || 'post'];
  const c = document.getElementById('canvas');
  c.dataset.theme = q.get('t') || 'yesil';
  for (const [k, v] of Object.entries(f.vars)) c.style.setProperty(k, v);
  if (!f.showUrl) document.getElementById('url').remove();
  for (const id of ['ipad', 'phL', 'phR']) {
    const [w, x, y] = f[id];
    const el = document.getElementById(id);
    el.style.setProperty('--dw', w + 'px');
    Object.assign(el.style, { left: x + 'px', top: y + 'px' });
  }
</script>
</body>
</html>
